# 快速测试配置 - KSPIR (关键词PIR)
# 论文: Practical Keyword Private Information Retrieval from Key-to-Index Mappings

# ============== 网络配置 ==============
server_name = server
server_ip = 127.0.0.1
server_port = 9002

client_name = client
client_ip = 127.0.0.1
client_port = 9003

# ============== 输出配置 ==============
append_string = quick_test

# ============== 协议类型 ==============
pto_type = SINGLE_CP_KS_PIR

# ============== 数据库配置 ==============
entry_bit_length = 8192                    
server_log_set_size = 16               
query_num = 1                          
parallel = true                          

# ============== KSPIR方案选择 ==============
# 可选值:
#   - SIMPLE_NAIVE  : KPIR^{kvs}  (直接KVS映射)
#   - SIMPLE_BIN    : KPIR^{hash} (哈希分桶)
#   - PGM_INDEX     : KPIR^{index}(PGM索引，推荐)
#   - CHALAMET      : ChalametPIR (Baseline)
single_cp_ks_pir_pto_name = PGM_INDEX
